[project]
name = "kids-play-backend"
version = "0.1.0"
description = "わたしのえほんのサーバー保存（PC の localhost だけで使う。既定は無効）"
requires-python = ">=3.14"
dependencies = [
    # webauthn が使う部品。最新の 6.2.0 系は公開から7日たっていない（2026-11-03 時点。T-04）ので、1つ前に固定する
    "cbor2==6.1.5",
    "fastapi>=0.156.8",
    "pyjwt==2.15.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "webauthn==3.0.1",
]

[tool.uv]
# パッケージとして配らない（アプリとして動かすだけ）
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ を読み込み先に足し、テストから app と tests を import できるようにする
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
# E/F/W：基本、I：import の並び、B：よくある誤り、UP：新しい書き方、S：セキュリティ（bandit 相当）
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# テストでは assert を使う（S101 は本番コードの assert を咎める規則）
"tests/**" = ["S101"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
