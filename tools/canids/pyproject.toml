[project]
name = "can-ids"
version = "0.1.0"
description = "自作の CAN の模擬ログに異常を入れ、DuckDB の SQL で検知する（学習用。実車や会社のログは使わない）"
requires-python = ">=3.14"
dependencies = [
    "duckdb==2.0.0",
]

[tool.uv]
package = false
# T-04：公開から7日たっていない版を選ばない（11/4 の7日前）
exclude-newer = "2026-10-28T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
