# PQC の試験用（19日目）。鍵交換の方式だけが違う入口を2つ用意して比べる
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    access_log off;

    # 毎回、最初からハンドシェイクする（再開を使うと鍵交換を省くので、比べられない）
    ssl_session_cache off;
    ssl_session_tickets off;
    ssl_protocols TLSv1.3;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # ハイブリッドだけ。OpenSSL 3.5 より古いと、この名前で nginx が起動しない（T-31）
    server {
        listen 8443 ssl;
        ssl_ecdh_curve X25519MLKEM768;
        location / {
            return 200 "hybrid\n";
        }
    }

    # 従来の方式だけ
    server {
        listen 8444 ssl;
        ssl_ecdh_curve X25519;
        location / {
            return 200 "classic\n";
        }
    }
}
