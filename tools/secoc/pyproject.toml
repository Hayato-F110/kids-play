[project]
name = "secoc-sim"
version = "0.1.0"
description = "SecOC の考え方（MAC とフレッシュネス）の学習用の模擬。AUTOSAR の実装ではない"
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.2",
]

[tool.uv]
# パッケージとして配らない（学習用に動かすだけ）
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
