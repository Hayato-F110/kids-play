<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>きっず あそびらんど</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <body>
    <!--
      アイコンの置き場。ここでは表示されず、<use href="#icon-..."> で呼び出したところに描かれる。
      Cでいう関数の定義と呼び出しの関係。同じ絵を何度も書かずに済む。
    -->
    <svg class="visually-hidden" aria-hidden="true">
      <symbol id="icon-animals" viewBox="0 0 96 96">
        <ellipse class="icon-ink" cx="24" cy="40" rx="11" ry="21" transform="rotate(16 24 40)" />
        <ellipse class="icon-ink" cx="72" cy="40" rx="11" ry="21" transform="rotate(-16 72 40)" />
        <circle class="icon-white" cx="48" cy="50" r="30" />
        <circle class="icon-ink" cx="37" cy="45" r="3.5" />
        <circle class="icon-ink" cx="59" cy="45" r="3.5" />
        <ellipse class="icon-ink" cx="48" cy="56" rx="6" ry="4.5" />
        <path class="icon-thin" d="M48 61v5M48 66q-5 6-10 1M48 66q5 6 10 1" />
      </symbol>

      <symbol id="icon-piano" viewBox="0 0 96 96">
        <rect class="icon-white" x="12" y="22" width="72" height="52" rx="8" />
        <path class="icon-thin" d="M30 22v52M48 22v52M66 22v52" />
        <rect class="icon-ink" x="24" y="22" width="12" height="28" rx="3" />
        <rect class="icon-ink" x="42" y="22" width="12" height="28" rx="3" />
        <rect class="icon-ink" x="60" y="22" width="12" height="28" rx="3" />
      </symbol>

      <symbol id="icon-draw" viewBox="0 0 96 96">
        <g transform="rotate(40 34 56)">
          <rect class="icon-white" x="25" y="34" width="18" height="46" rx="4" />
          <path class="icon-pink" d="M25 34l9-16 9 16z" />
          <path class="icon-thin" d="M25 66h18" />
        </g>
        <path
          class="icon-yellow"
          d="M68 14l5.3 10.7 11.8 1.7-8.5 8.3 2 11.8L68 41l-10.6 5.5 2-11.8-8.5-8.3 11.8-1.7z"
        />
      </symbol>

      <symbol id="icon-storybook" viewBox="0 0 96 96">
        <path class="icon-white" d="M48 28c-8-7-20-8-34-6v46c14-2 26-1 34 6z" />
        <path class="icon-white" d="M48 28c8-7 20-8 34-6v46c-14-2-26-1-34 6z" />
        <path
          class="icon-thin"
          d="M22 36c6-.6 12 0 18 2M22 48c6-.6 12 0 18 2M74 36c-6-.6-12 0-18 2M74 48c-6-.6-12 0-18 2"
        />
      </symbol>
    </svg>

    <div class="screen">
      <header class="topbar">
        <!-- トップ画面なので、左のおうちボタンは置かない。列だけ空けて、消音ボタンの位置を全画面でそろえる -->
        <!-- ことばの途中で折り返さないよう、まとまりごとに span で囲む -->
        <h1 class="topbar__title"><span>きっず</span> <span>あそびらんど</span></h1>
        <button class="btn btn--round topbar__right" type="button" aria-pressed="false" data-mute-button>
          <span class="visually-hidden" data-mute-label>おとを けす</span>
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M7 19h8l10-8v26l-10-8H7z" fill="currentColor" />
            <g class="icon-sound-on">
              <path d="M32 18q5 6 0 12" />
              <path d="M37 12q10 12 0 24" />
            </g>
            <path class="icon-sound-off" d="M32 19l10 10M42 19L32 29" />
          </svg>
        </button>
      </header>

      <main class="menu-area">
        <nav class="menu" aria-label="あそびを えらぶ">
          <!-- まだ作っていないミニアプリは、仮に「じゅんびちゅう」へ移動する -->
          <a class="menu__item menu__item--animals" href="apps/animals/index.html">
            <span class="btn menu__face">
              <svg class="icon" aria-hidden="true"><use href="#icon-animals" /></svg>
            </span>
            <span class="label">どうぶつ</span>
          </a>
          <a class="menu__item menu__item--piano" href="apps/piano/index.html">
            <span class="btn menu__face">
              <svg class="icon" aria-hidden="true"><use href="#icon-piano" /></svg>
            </span>
            <span class="label">ぴあの</span>
          </a>
          <a class="menu__item menu__item--draw" href="apps/soon/index.html">
            <span class="btn menu__face">
              <svg class="icon" aria-hidden="true"><use href="#icon-draw" /></svg>
            </span>
            <span class="label">おえかき</span>
          </a>
          <a class="menu__item menu__item--storybook" href="apps/soon/index.html">
            <span class="btn menu__face">
              <svg class="icon" aria-hidden="true"><use href="#icon-storybook" /></svg>
            </span>
            <span class="label">えほん</span>
          </a>
        </nav>
      </main>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
