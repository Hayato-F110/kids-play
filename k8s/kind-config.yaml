# kind（Docker の中で動く Kubernetes）の設定。20日目、KIDS-64。脅威分析 T-33、C-36。
# 作る：kind create cluster --name kids-play --config k8s/kind-config.yaml
# 消す：kind delete cluster --name kids-play（kubeconfig の項目も消える）
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # kubectl がつなぐ API サーバーは、この PC の中（127.0.0.1）からだけ届くようにする。
  # 管理者の権限で何でもできる入口なので、同じ Wi-Fi のほかの機器に見せない
  apiServerAddress: 127.0.0.1
nodes:
  - role: control-plane
    # kind v0.33.0 の既定のノード。kind の案内どおり、digest で固定する（すり替え対策。T-04）
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # web の Service（NodePort 30080）を、PC の 127.0.0.1:8081 に出す。
      # compose の版（8080）と同時に動かしても重ならない番号にした
      - containerPort: 30080
        hostPort: 8081
        listenAddress: 127.0.0.1
        protocol: TCP
