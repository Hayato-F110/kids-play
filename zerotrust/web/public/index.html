<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 読み込みと通信は自分のオリジンだけ（C-08 と同じ考え方） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>おとなのページ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>おとなのページ</h1>
      <p class="note">ゼロトラストの構成の確かめ用。子どもの絵と声は扱わない。</p>
      <p id="state" class="state" aria-live="polite"></p>

      <section>
        <h2>1. パスキーを登録する（最初の1回）</h2>
        <label for="setup-code">合言葉（api のコンテナのログに出る）</label>
        <input id="setup-code" autocomplete="off" spellcheck="false" />
        <button id="register" type="button">登録する</button>
      </section>

      <section>
        <h2>2. ログインする</h2>
        <button id="login" type="button">パスキーでログイン</button>
        <button id="logout" type="button">ログアウト</button>
      </section>

      <section>
        <h2>3. API を読む</h2>
        <button id="summary" type="button">トークンを付けて読む</button>
        <button id="summary-without-token" type="button">トークンなしで読む</button>
      </section>

      <h2>記録</h2>
      <ol id="log" class="log" reversed></ol>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
