# nginx → api の中継の共通の設定（zerotrust.conf から読む）。

# Host はポートつきのまま渡す（API の Host と Origin の確認のため。default.conf と同じ）
proxy_set_header Host $http_host;

# nginx の証明書（クライアント用）。api はこれがない接続を TLS の段階で断る
proxy_ssl_certificate /certs/nginx.crt;
proxy_ssl_certificate_key /certs/nginx.key;
# api の証明書を、この構成の CA で確かめ、名前が api であることも確かめる（なりすましの api に送らない）
proxy_ssl_trusted_certificate /certs/ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_name api;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.3;
