# ゼロトラストの構成（compose.zerotrust.yaml）でだけ使う nginx の設定。default.conf の代わりに差し込む。
# nginx → api は mTLS：nginx は自分の証明書を見せ、api の証明書を CA で確かめる（T-30、C-33）。
# nginx は入口の絞り込み（メソッドと大きさ）だけを行い、認証と認可は api が要求ごとに行う（PEP は api）
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # おとなのページ（TypeScript から作った JS）。この構成のときだけ配る
    location = /parent {
        return 301 /parent/;
    }
    location /parent/ {
        alias /usr/share/nginx/parent/;
        index index.html;
    }

    # ログインの窓口だけは POST を通す。パスキーの応答は数KBなので、大きな中身は受け取る前に断る
    location /api/auth/ {
        limit_except POST {
            deny all;
        }
        client_max_body_size 16k;
        proxy_pass https://api:8443;
        include /etc/nginx/zerotrust-proxy.conf;
    }

    # それ以外の API は、これまでどおり読む要求だけ（C-12 の nginx の部分）
    location /api/ {
        limit_except GET HEAD {
            deny all;
        }
        client_max_body_size 1k;
        proxy_pass https://api:8443;
        include /etc/nginx/zerotrust-proxy.conf;
    }
}
