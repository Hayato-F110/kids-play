# EC2 の上の nginx（13日目）。HTTPS の入口になり、web のコンテナ（127.0.0.1:8080）へ中継する。
# 置き場所は EC2 の /etc/nginx/sites-available/kids-play（sites-enabled にリンクする）。
# certbot --nginx が、このファイルに 443 の設定と、HTTP から HTTPS への転送を書き足す。
# certbot が書き足したあとの形も、このファイルに写して残す（サーバーとリポジトリをずらさない）

# HTML だけ、使う前に毎回サーバーに確かめさせる（no-cache。変わっていなければ 304 で済む）。
# 指定がないと、ブラウザが勝手に使い回す期間を決め、デプロイのあとも古い画面が出続けることがある（ZAP の 10015）。
# 空の値のときは、nginx はヘッダーを付けない
map $sent_http_content_type $kids_cache_control {
    ~^text/html "no-cache";
    default     "";
}

server {
    server_name kidsplay-110.duckdns.org;
    # 応答に nginx の版を出さない（攻撃者に手がかりを与えない）
    server_tokens off;

    location / {
        # 公開しているのは静的なファイルだけなので、読む要求（GET、HEAD）だけを通す。
        # 書き込みの要求は、中身を受け取る前に断る。コンテナの nginx の前に置いたので、
        # ここで断らないと、この nginx が先に中身（絵と声）を一時ファイルにためてしまう（T-19、C-12）
        limit_except GET HEAD {
            deny all;
        }
        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8080;
        # Host はポートつきのまま渡す（コンテナの nginx と同じ考え方。T-18）
        proxy_set_header Host $http_host;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kidsplay-110.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kidsplay-110.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    # TLS の版（1.2 と 1.3 だけ）と暗号の組は、上の options-ssl-nginx.conf（certbot が管理）で決まる

    # セキュリティヘッダー（13日目、KIDS-44。C-14）。always を付け、エラーの応答にも付ける。
    # location の中に add_header を書くと、ここの設定が引き継がれなくなるので、書き足すときは注意する
    # 1年間は HTTPS でしかつながせない（最初の1回の HTTP も、2回目からはブラウザが HTTPS に直す）。
    # preload（ブラウザへの登録）はしない。DuckDNS のサブドメインで、外したくなったときに戻せなくなるため
    add_header Strict-Transport-Security "max-age=31536000" always;
    # 各 HTML の meta と同じ CSP（C-08）に、meta では効かない frame-ancestors を足す（他のサイトの枠に入れさせない）。
    # ヘッダーと meta の CSP は両方が効き、両方で許されたものだけが通る。connect-src 'self' は、えほんの meta に
    # 合わせたもの（ほかのページは meta の側で通信を禁止したままになる）。
    # Service Worker（sw.js）には meta が効かず、このヘッダーだけが効く。connect-src 'self' を消すと、
    # sw.js の取得（install のときの保存、裏での取り直し）が止まり、PWA と電波がないときの動作が壊れる
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # frame-ancestors を知らない古いブラウザ向けに、同じ意味の古い書き方も付ける
    add_header X-Frame-Options "DENY" always;
    # ファイルの種類をブラウザに推測させない（画像のふりをしたスクリプトを動かさせない）
    add_header X-Content-Type-Options "nosniff" always;
    # 外へのリンクはないが、念のため、どのページから来たかを相手に送らない
    add_header Referrer-Policy "no-referrer" always;
    # マイクは自分のページ（えほん）だけ。カメラ・位置情報などは使わないので禁止する（T-06）
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    # 別のサイトの窓や読み込みから、このサイトの中身に手を出させない
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $kids_cache_control always;
}

server {
    if ($host = kidsplay-110.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name kidsplay-110.duckdns.org;
    return 404; # managed by Certbot


}
