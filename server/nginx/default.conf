# キッズあそびランドの配信（compose の web コンテナ）。
# 12日目以降は EC2 の上でも同じイメージを使い、HTTPS は13日目に足す
server {
    # root 以外で動くので、1024 より上のポートで待ち受ける
    listen 8080;
    server_name _;
    # 応答に nginx の版を出さない（攻撃者に手がかりを与えない）
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        # ないファイルは 404。フォルダの一覧は出さない（autoindex は既定で off）
        try_files $uri $uri/ =404;
    }

    # nginx の種類の一覧に .webmanifest がないので、PWA の設定ファイルとして正しい種類を付ける
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location /api/ {
        # コンテナの版はサーバー保存を使わない（T-08、C-12）。読む要求（GET、HEAD）だけを中継し、
        # 書き込みの要求は、nginx が中身を受け取る前に 403 で断る。
        # API に届いてから断ると、nginx がその前に中身（絵と声）を一時ファイルにためてしまう
        limit_except GET HEAD {
            deny all;
        }
        # 読む要求に中身は要らない。大きな中身は、受け取る前に 413 で断る
        client_max_body_size 1k;
        proxy_pass http://api:8000;
        # Host はポートつきのまま渡す。API の Host の確認と CSRF の確認（Origin と Host の一致）が、
        # $host だとポートが落ちて一致しなくなるため（storage-interface.md の申し送り、T-18）
        proxy_set_header Host $http_host;
    }
}
