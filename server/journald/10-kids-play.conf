# EC2 の journald の設定（12日目）。置き場所：/etc/systemd/journald.conf.d/10-kids-play.conf
# nginx のアクセスログ（見に来た人の IP と User-Agent）も journald に入る（server/compose.yaml）。
# 調査に使える最低限の期間だけ残し、古いものは自動で消す（T-19。学習者の判断で 14日・200MB）
[Journal]
# 再起動しても消えないよう、ディスクに残す（期間と容量の上限は下の2行で守る）
Storage=persistent
SystemMaxUse=200M
MaxRetentionSec=14day
# journald は古い記録をファイル単位で消す。ファイルの切り替えの既定は1か月なので、そのままだと
# 14日を過ぎても残る。1日ごとに切り替え、14日の期限がファイルの中の記録にも効くようにする
MaxFileSec=1day
