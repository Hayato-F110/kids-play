# CI：PR でテストとイメージの検査をし、main に入ったら検査を通ったイメージを GHCR に置く。
#   test ───────┐
#   scan ───────┤
#   k8s-config ─┴─▶ push ─▶ sign ─▶ verify（push から先は main のときだけ。権限は必要な作業にだけ渡す）
# EC2 への deploy の作業は、14日目に AWS を片付けたので外した（中身は git の履歴と server/aws/ に残る）
# scan では外部のスキャナー（Trivy）を動かすので、書き込みの権限を渡さない。
# 2026年3月に trivy-action のタグが乗っ取られ、CI の秘密情報を盗む事件があったため（CVE-2026-33634、T-04）
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 既定はリポジトリを読むだけ。必要な作業にだけ、必要な権限を足す（最小権限）
permissions:
  contents: read

# 同じ PR に新しいコミットが来たら、古い実行は止める。main への実行は最後まで進める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: テスト（フロントとバックエンド）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # アクションは、タグではなくコミットIDで固定する（タグは付け替えられるため）
      - name: リポジトリを取り出す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 取り出したあとに認証情報を残さない

      - name: Node.js を用意する
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # package-lock.json のとおりの版だけを入れる
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:pwa
      - run: npm test
      # おとなのページ（zerotrust/web）の型の検査。型の誤りがあれば失敗させる
      - run: npm run typecheck
      - name: 変換した JS が TypeScript と食い違っていないかを確かめる
        # コミットした main.js が古いと、型の検査を通ったソースと、実際に配る JS が違ってしまう
        run: |
          npm run build:zerotrust
          git diff --exit-code -- zerotrust/web/public

      - name: uv を用意する
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - name: バックエンドの静的解析とテスト
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: SecOC の模擬の静的解析とテスト
        working-directory: tools/secoc
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      # Docker の nginx を使う結合のテスト（test_integration.py）は、PQC_INTEGRATION がないので飛ばされる
      - name: PQC の計測の道具の静的解析とテスト
        working-directory: tools/pqc
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: CAN の異常検知の静的解析とテスト
        working-directory: tools/canids
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      # 攻撃のテストは Docker の掲示板が要るので、手元だけで動かす（ここでは静的解析だけ）
      - name: PHP の掲示板の攻撃のテストの静的解析
        working-directory: tools/bbs
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .

  scan:
    name: イメージの検査（${{ matrix.image }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    env:
      IMAGE: kids-play-${{ matrix.image }}:ci
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 外部の部品を増やさないよう、ビルドは docker コマンドで直接行う。
      # source のラベルで、GHCR のパッケージをこのリポジトリに結びつける
      - name: イメージをビルドする
        run: >-
          docker build
          --file docker/${{ matrix.image }}.Dockerfile
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag "$IMAGE" .

      # SBOM（部品表）は、検査に落ちても残す。どの部品が原因かを調べるのに使う
      - name: SBOM（CycloneDX）を作る
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json

      # 直し方が出ている「重大（CRITICAL）」の脆弱性が1つでもあれば、CI を失敗させる。
      # 直し方がまだないものは、ベースイメージの更新（Dependabot）で直るのを待つ
      - name: 重大な脆弱性があれば失敗させる
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: SBOM を成果物として保存する
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          if-no-files-found: error

      # 検査を通ったイメージそのものを push の作業に渡す（push の側で作り直すと、検査したものと違うものになりうる）
      - name: 検査したイメージを渡す（main のときだけ）
        if: ${{ github.event_name == 'push' }}
        run: docker save "$IMAGE" | gzip > image-${{ matrix.image }}.tar.gz
      - if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: image-${{ matrix.image }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  # Kubernetes のマニフェスト（k8s/）の設定検査（20日目、C-36 (6)）。
  # root で動く、権限が強すぎる、上限がない、などの書き方を、クラスターに入れる前に見つける。
  # scan と同じく外部のスキャナーを動かすので、書き込みの権限は渡さない
  k8s-config:
    name: マニフェストの設定検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 重大（HIGH・CRITICAL）な設定の誤りがあれば失敗させる
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: k8s
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  push:
    name: GHCR に置く
    needs: [test, scan, k8s-config]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GHCR への書き込みは、この作業だけ。外部のスキャナーは動かさない
    permissions:
      contents: read
      packages: write
    env:
      # GHCR の名前は小文字だけ
      OWNER: ${{ github.repository_owner }}
    outputs:
      owner: ${{ steps.push.outputs.owner }}
      api_digest: ${{ steps.push.outputs.api_digest }}
      web_digest: ${{ steps.push.outputs.web_digest }}
    steps:
      - name: 検査したイメージを受け取る
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true

      - name: GHCR にログインして push する
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          owner="${OWNER,,}"
          # トークンはコマンドの引数に書かず、標準入力で渡す（ログやプロセスの一覧に残さない）
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for name in api web; do
            gunzip -c "image-$name.tar.gz" | docker load
            for tag in "sha-$SHA" main; do
              docker tag "kids-play-$name:ci" "ghcr.io/$owner/kids-play-$name:$tag"
              docker push "ghcr.io/$owner/kids-play-$name:$tag"
            done
            # タグは付け替えられるので、署名の対象はレジストリにあるダイジェストにする
            digest="$(docker buildx imagetools inspect "ghcr.io/$owner/kids-play-$name:sha-$SHA" --format '{{.Manifest.Digest}}')"
            echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  # 署名の権限（id-token）は、この作業だけに渡す。Trivy や push の処理と同じ作業の中に置かない
  sign:
    name: 署名と来歴（${{ matrix.image }}）
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ needs.push.outputs.owner }}/kids-play-${{ matrix.image }}
      DIGEST: ${{ needs.push.outputs[format('{0}_digest', matrix.image)] }}
    steps:
      - name: cosign を用意する
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: GHCR にログインする
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # 鍵を持たず、CI の身元で短い期限の証明書をもらって署名する。記録は公開の透明性ログに残る（T-27）
      - name: 署名する
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: 来歴を付ける
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - if: ${{ always() }}
        run: docker logout ghcr.io

  # 確かめる側には、読む権限だけを渡す。成功するはずのものと、失敗するはずのものの両方を試す
  verify:
    name: 署名の検証（${{ matrix.image }}）
    needs: [push, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ needs.push.outputs.owner }}/kids-play-${{ matrix.image }}
      DIGEST: ${{ needs.push.outputs[format('{0}_digest', matrix.image)] }}
      ISSUER: https://token.actions.githubusercontent.com
      WORKFLOW: https://github.com/${{ github.repository }}/.github/workflows
      # 署名を始める前の main のイメージ。同じ名前で署名がないものとして使う
      UNSIGNED_TAG: sha-4c196d3d3ac8f6681d81263ff83f4521d43dea04
    steps:
      - name: cosign を用意する
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: GHCR にログインする
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: 正しい署名は通る
        run: >-
          cosign verify "$IMAGE@$DIGEST"
          --certificate-identity "$WORKFLOW/ci.yml@refs/heads/main"
          --certificate-oidc-issuer "$ISSUER"

      # 通信の失敗でも cosign は失敗するので、署名が理由で断られたことまで確かめる
      - name: 違うワークフローの身元と、署名のないイメージは断られる
        run: |
          expect_rejected() {
            if output="$(cosign verify "$1" --certificate-identity "$2" --certificate-oidc-issuer "$ISSUER" 2>&1)"; then
              echo "断られるはずの検証が通った：$1"
              exit 1
            fi
            echo "$output"
            echo "$output" | grep -E "$3"
          }
          expect_rejected "$IMAGE@$DIGEST" "$WORKFLOW/other.yml@refs/heads/main" "no matching CertificateIdentity found"
          expect_rejected "$IMAGE:$UNSIGNED_TAG" "$WORKFLOW/ci.yml@refs/heads/main" "no signatures found"

      - if: ${{ always() }}
        run: docker logout ghcr.io
